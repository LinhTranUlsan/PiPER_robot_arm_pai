[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_piper_master_bimanual"
version = "0.1.0"
description = "LeRobot teleoperator plugin: read both AgileX PiPER master arms, one per CAN bus, as a single bimanual teleoperator."
requires-python = ">=3.12"
dependencies = ["piper_sdk", "python-can", "lerobot_teleoperator_piper_master"]

[tool.setuptools.packages.find]
include = ["lerobot_teleoperator_piper_master_bimanual*"]
