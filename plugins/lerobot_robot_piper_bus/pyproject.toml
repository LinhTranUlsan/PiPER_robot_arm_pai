[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper_bus"
version = "0.1.0"
description = "LeRobot robot plugin: AgileX PiPER follower read over a single shared CAN bus (firmware master-slave)."
requires-python = ">=3.12"
dependencies = ["piper_sdk", "python-can"]

[tool.setuptools.packages.find]
include = ["lerobot_robot_piper_bus*"]
